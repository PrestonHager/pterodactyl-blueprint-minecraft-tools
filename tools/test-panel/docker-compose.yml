services:
  database:
    image: mariadb:11
    environment:
      MYSQL_DATABASE: panel
      MYSQL_USER: pterodactyl
      MYSQL_PASSWORD: pterodactyl
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - panel_database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  cache:
    image: valkey/valkey:alpine
    command: ["valkey-server", "--requirepass", "pterodactyl"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=pterodactyl valkey-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  panel:
    image: ghcr.io/blueprintframework/blueprint:v1.15.1
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    ports:
      - "${PANEL_PORT:-8080}:80"
    volumes:
      - panel_app:/app
      - "${TEST_PANEL_DIR:-./.test-panel}/extensions:/blueprint_extensions"
      - "${TEST_PANEL_DIR:-./.test-panel}/logs:/app/storage/logs"
    environment:
      APP_URL: http://localhost:${PANEL_PORT:-8080}
      PANEL_PORT: 8080
      APP_ENV: local
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_TIMEZONE: UTC
      APP_SERVICE_AUTHOR: test@pterodactyl.local
      APP_ENVIRONMENT_ONLY: "false"
      DB_CONNECTION: mariadb
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: panel
      DB_USERNAME: pterodactyl
      DB_PASSWORD: pterodactyl
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_DRIVER: redis
      REDIS_HOST: cache
      REDIS_PORT: 6379
      REDIS_PASSWORD: pterodactyl
      MAIL_MAILER: log
      MAIL_FROM_ADDRESS: test@pterodactyl.local
      MAIL_FROM_NAME: Minecraft Tools Test Panel
      APP_2FA_REQUIRED: "0"
      RECAPTCHA_ENABLED: "false"
      DB_STRICT_MODE: "false"
      TRUSTED_PROXIES: "*"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 30

  wings:
    image: ghcr.io/pterodactyl/wings:v1.13.3
    depends_on:
      - panel
    ports:
      - "${WINGS_PORT:-8090}:8090"
      - "2022:2022"
    environment:
      TZ: UTC
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - wings_config:/etc/pterodactyl
      - wings_data:/var/lib/docker/volumes/minecraft-tools-test-panel_wings_data/_data
      - wings_tmp:/var/lib/docker/volumes/minecraft-tools-test-panel_wings_tmp/_data
    command: ["--config", "/etc/pterodactyl/config.yml", "--debug"]
    restart: unless-stopped

networks:
  default:
    name: minecraft-tools-test-panel
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  panel_app:
  panel_database:
  wings_config:
  wings_data:
  wings_tmp:
